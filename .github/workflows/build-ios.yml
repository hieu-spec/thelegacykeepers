# .github/workflows/build-ios.yml
name: Build iOS IPA (The Legacy Keepers)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt thư viện & Build Static Mobile Assets
        run: |
          npm install
          npm run export:static

      - name: Đồng bộ Capacitor sang iOS
        run: |
          npm run cap -- sync ios

      - name: Biên dịch Xcode Archive (Không cần chứng chỉ trả phí Apple)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET_ARG="-workspace App.xcworkspace"
          else
            TARGET_ARG="-project App.xcodeproj"
          fi
          xcodebuild $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Đóng gói thành file .ipa (Sẵn sàng cài qua Sideloadly / AltStore / 3uTools)
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r LegacyKeepers-iOS.ipa Payload

      - name: Tải file LegacyKeepers-iOS.ipa lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyKeepers-iOS-IPA
          path: LegacyKeepers-iOS.ipa
          if-no-files-found: error
